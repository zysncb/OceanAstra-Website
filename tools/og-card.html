<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#07090F;overflow:hidden;position:relative;color:#F2F2F0}
  .glow{position:absolute;width:980px;height:980px;border-radius:50%;
        background:radial-gradient(circle,rgba(91,108,255,.26) 0%,transparent 62%);
        top:-420px;right:-300px}
  .grid{position:absolute;inset:0;
        background-image:linear-gradient(rgba(242,242,240,.03) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(242,242,240,.03) 1px,transparent 1px);
        background-size:60px 60px}
  .inner{position:relative;padding:74px 84px;height:100%;display:flex;
         flex-direction:column;align-items:flex-start}
  .brand{display:flex;align-items:center;gap:16px}
  .brand span{font-family:'Space Grotesk',sans-serif;font-size:44px;
              font-weight:700;letter-spacing:-.03em}
  h1{margin-top:auto;font-family:Archivo,sans-serif;font-size:64px;line-height:1.1;
     letter-spacing:-.03em;font-weight:600;max-width:15ch}
  .accent{color:#5B6CFF}
  .foot{margin-top:40px;display:flex;align-items:center;gap:14px;
        font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px;
        color:#8A90A0;letter-spacing:.04em;text-transform:uppercase}
  .sep{color:#5B6CFF}
</style></head><body>
  <div class="glow"></div><div class="grid"></div>
  <div class="inner">
    <div class="brand"><svg data-dc-tpl="9" width="60" height="60" viewBox="0 0 120 120" fill="none" style="flex: 0 0 auto;">
          <defs data-dc-tpl="10"><clipPath data-dc-tpl="11" id="w-nav"><circle data-dc-tpl="12" cx="60" cy="60" r="42"></circle></clipPath></defs>
          <g data-dc-tpl="13" clip-path="url(#w-nav)">
            <path data-dc-tpl="14" d="M 8 70.4 Q 28 56.4 48 70.4 T 88 70.4 T 128 70.4" stroke="#5B6CFF" stroke-width="9" fill="none"></path>
            <circle data-dc-tpl="15" cx="70.4" cy="46" r="6" fill="#F2F2F0"></circle>
          </g>
          <circle data-dc-tpl="16" cx="60" cy="60" r="46" stroke="#F2F2F0" stroke-width="8" fill="none"></circle>
        </svg><span>OceanAstra</span></div>
    <h1>Bringing AI into every enterprise in the <span class="accent">Middle East</span>.</h1>
    <div class="foot"><span>Dubai, United Arab Emirates</span>
      <span class="sep">/</span><span>oceanastra.net</span></div>
  </div>
</body></html>
