<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — OceanAstra</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090f">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #07090f;
    --ink: #f2f2f0;
    --muted: #8a93a8;
    --accent: #5b6cff;
    --line: #262d42;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background-image:
      radial-gradient(1px 1px at 18% 24%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 72% 18%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 44% 68%, rgba(139,152,255,.6), transparent),
      radial-gradient(1px 1px at 86% 74%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 30% 86%, rgba(255,255,255,.3), transparent);
  }
  main { max-width: 560px; }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: .8rem;
    letter-spacing: .18em;
    color: var(--accent);
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(2rem, 6vw, 3.1rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -.02em;
    text-wrap: balance;
    margin-bottom: 18px;
  }
  p { color: var(--muted); font-size: 1.02rem; line-height: 1.65; margin-bottom: 34px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink);
    text-decoration: none;
    font-size: .94rem;
    transition: border-color .18s, color .18s;
  }
  a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  a:hover { border-color: var(--accent); color: var(--accent); }
  a.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page does not exist.</h1>
    <p>The address may have changed, or the link that brought you here may be out of date.</p>
    <div class="links">
      <a class="primary" href="/">Go to the homepage</a>
      <a href="/contact/">Contact us</a>
    </div>
  </main>
</body>
</html>
